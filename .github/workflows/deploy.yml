name: Deploy Farmforge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farmforge-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test simulation
        run: npm test

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets."
            exit 1
          fi

      - name: Initialize D1 schema
        run: npx --yes wrangler@4 d1 execute db01 --remote --file=./schema/schema.sql --yes

      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy

      - name: Check live deployment
        env:
          FARMFORGE_URL: https://farmforge.jonatanfsnorrby.workers.dev
        shell: bash
        run: |
          # Existing edge instances may briefly serve the preceding version.
          sleep 10
          npx --yes wrangler@4 tail farmforge --format=pretty --method=POST > /tmp/farmforge-tail.log 2>&1 &
          tail_pid=$!
          sleep 3
          set +e
          node tests/smoke.mjs
          smoke_status=$?
          set -e
          kill "$tail_pid" 2>/dev/null || true
          if [[ "$smoke_status" != 0 ]]; then
            echo "Recent Worker error logs:"
            tail -n 80 /tmp/farmforge-tail.log
          fi
          exit "$smoke_status"

      - name: Remove smoke-test account
        if: always()
        shell: bash
        run: |
          if [[ -f .smoke-username ]]; then
            username="$(cat .smoke-username)"
            if [[ "$username" =~ ^smoke_[a-f0-9]{14}$ ]]; then
              npx --yes wrangler@4 d1 execute db01 --remote --command "DELETE FROM users WHERE username = '$username';" --yes
            else
              echo "::error::Smoke-test username format is invalid."
              exit 1
            fi
          fi
